<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heartopia V32 Invincible</title>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <script src="https://unpkg.com/tone"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Roboto+Mono:wght@700&display=swap');

        body {
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            touch-action: none;
            user-select: none;
        }

        /* SHEET MUSIC */
        #sheet-container {
            height: 160px;
            background: #20202a;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 50% 0 50px;
            position: relative;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        #sheet-marker {
            position: absolute; left: 50px; top: 0; bottom: 0; width: 4px;
            background: rgba(255, 255, 255, 0.9); z-index: 5; pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        .sheet-group {
            display: inline-flex; flex-direction: column-reverse;
            align-items: center; justify-content: center;
            margin: 0 8px; padding: 5px 8px; border-radius: 8px;
            background: rgba(255,255,255,0.05); min-width: 45px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.1s;
        }
        .char-note {
            font-family: 'Roboto Mono', monospace; font-size: 24px; font-weight: 900;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.8); line-height: 1.0; margin: 2px 0; display: block;
        }
        .group-active {
            background: rgba(255,255,255,0.15); transform: scale(1.2); z-index: 10;
            border: 2px solid #fff; box-shadow: 0 0 25px rgba(255,255,255,0.2);
        }
        .group-passed { opacity: 0.2; filter: grayscale(100%); transform: scale(0.9); }

        /* CONTROLS */
        #controls {
            padding: 5px 15px; background: rgba(30, 30, 40, 0.98);
            display: flex; gap: 10px; align-items: center;
            height: 50px; border-bottom: 1px solid #444; z-index: 20;
            flex-shrink: 0;
        }
        button, input[type=file]::file-selector-button {
            padding: 6px 12px; background: #4a4a6a; color: white;
            border: 2px solid #6c6c9d; border-radius: 8px;
            font-family: 'Nunito', sans-serif; font-weight: bold; font-size: 12px; cursor: pointer;
        }
        button:hover { filter: brightness(1.2); }
        button[data-mode="AUTO"] { background: #00d2ff; color: #000; }
        button[data-mode="MANUAL"] { background: #ffc107; color: #000; }
        button[data-mode="WAIT"] { background: #ff4757; color: #fff; box-shadow: 0 0 5px #ff4757; }
        button.active { background: #fff; color: #000; border-color: #00d2ff; }

        /* HISTORY BAR */
        #history-bar {
            height: 35px; background: rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: flex-end;
            padding: 0 15px; overflow: hidden; border-bottom: 1px solid #333; position: relative; z-index: 15;
            flex-shrink: 0;
        }
        .history-item {
            font-family: 'Nunito', sans-serif; font-weight: bold; font-size: 14px;
            margin-left: 6px; padding: 2px 8px; border-radius: 4px;
            background: rgba(255,255,255,0.1); border: 1px solid;
            animation: fadeOut 4s forwards; white-space: nowrap;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(10px); } 10% { transform: translateX(0); }
            80% { opacity: 0.7; } 100% { opacity: 0; transform: translateX(-10px); }
        }

        /* CANVAS */
        #canvas-container {
            flex-grow: 1; position: relative;
            background: linear-gradient(180deg, #15151a 0%, #1a1a24 100%);
            min-height: 200px;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        
        #statusText { font-size: 12px; color: #ffd700; margin-left: auto; font-weight: bold; }
        .ready { color: #00ff88 !important; }
    </style>
</head>
<body>

<div id="sheet-container">
    <div id="sheet-marker"></div>
    <div id="sheet-content" style="display:flex; align-items:center;">
        <span style="color:#aaa; font-size:14px; padding-left:20px;">Load MIDI...</span>
    </div>
</div>

<div id="controls">
    <input type="file" id="fileInput" accept=".mid">
    <button id="btnPlay">PLAY</button>
    <button id="btnPlayMode" data-mode="AUTO">Mode: AUTO</button>
    <button id="btnViewMode" class="active">View: MOBILE</button> 
    <span id="statusText">Loading...</span>
</div>

<div id="history-bar" style="display:none;">
    <span style="color:#666; font-size:10px; margin-right:auto;">HISTORY:</span>
</div>

<div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // --- 1. CONFIG & MAPPING ---
    const KEY_INFO = {};
    const KEY_MAP_PC = {}; 
    const ROWS = { LOW: [], MID: [], HIGH: [] };
    const ROW_COLORS = { 0: '#ff99aa', 1: '#66ddff', 2: '#ffdd44' };

    function addKey(pitch, charPC, charMobile, rowType, style) {
        let rowArr = (rowType === 0) ? ROWS.LOW : (rowType === 1) ? ROWS.MID : ROWS.HIGH;
        let slotInRow = rowArr.length;
        let globalSlot = (rowType === 0) ? (slotInRow>=5 ? slotInRow+1 : slotInRow) : (rowType === 1 ? 14+slotInRow : 27+slotInRow);

        KEY_INFO[pitch] = { charPC, charMobile, row: rowType, slotRow: slotInRow, slotGlobal: globalSlot, style };
        
        const lowerChar = charPC.toLowerCase();
        KEY_MAP_PC[lowerChar] = pitch;
        if(".,/;[]-=".includes(charPC)) KEY_MAP_PC[charPC] = pitch;
        rowArr.push(pitch);
    }

    // Define Keys
    addKey(48, ',', '1', 0, 'w'); addKey(49, 'L', '1#', 0, 'b'); addKey(50, '.', '2', 0, 'w'); 
    addKey(51, ';', '2#', 0, 'b'); addKey(52, '/', '3', 0, 'w'); addKey(53, 'O', '4', 0, 'b'); 
    addKey(54, '0', '4#', 0, 'b'); addKey(55, 'P', '5', 0, 'w'); addKey(56, '-', '5#', 0, 'b'); 
    addKey(57, '[', '6', 0, 'w'); addKey(58, '=', '6#', 0, 'b'); addKey(59, ']', '7', 0, 'w');

    addKey(60, 'Z', '1', 1, 'w'); addKey(61, 'S', '1#', 1, 'b'); addKey(62, 'X', '2', 1, 'w'); 
    addKey(63, 'D', '2#', 1, 'b'); addKey(64, 'C', '3', 1, 'w'); addKey(65, 'V', '4', 1, 'w'); 
    addKey(66, 'G', '4#', 1, 'b'); addKey(67, 'B', '5', 1, 'w'); addKey(68, 'H', '5#', 1, 'b'); 
    addKey(69, 'N', '6', 1, 'w'); addKey(70, 'J', '6#', 1, 'b'); addKey(71, 'M', '7', 1, 'w');

    addKey(72, 'Q', '1', 2, 'w'); addKey(73, '2', '1#', 2, 'b'); addKey(74, 'W', '2', 2, 'w'); 
    addKey(75, '3', '2#', 2, 'b'); addKey(76, 'E', '3', 2, 'w'); addKey(77, 'R', '4', 2, 'w'); 
    addKey(78, '5', '4#', 2, 'b'); addKey(79, 'T', '5', 2, 'w'); addKey(80, '6', '5#', 2, 'b'); 
    addKey(81, 'Y', '6', 2, 'w'); addKey(82, '7', '6#', 2, 'b'); addKey(83, 'U', '7', 2, 'w'); 
    addKey(84, 'I', '7#', 2, 'w');

    const MAX_SLOTS_PC = 41;

    // --- 2. AUDIO & STATE ---
    const sampler = new Tone.Sampler({
        urls: { "A0":"A0.mp3", "C1":"C1.mp3", "C2":"C2.mp3", "C3":"C3.mp3", "C4":"C4.mp3", "C5":"C5.mp3", "C6":"C6.mp3", "C7":"C7.mp3" },
        release: 1, baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => {
            document.getElementById('statusText').innerText = "Sound Ready!";
            document.getElementById('statusText').classList.add('ready');
        }
    }).toDestination();
    const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.2 }).toDestination();
    sampler.connect(reverb); sampler.volume.value = -5;

    let midiData = null;
    let isPlaying = false;
    let viewMode = 'MOBILE';
    let soundMode = 'AUTO'; 
    let activeTouches = new Set(); 
    let activeAutoNotes = new Set(); 
    let sheetElements = [];
    let playGroups = []; 
    let nextGroupIndex = 0;
    let waitingForPitches = new Set(); 
    let isWaitingState = false; 
    let wrongKeyFeedback = null; 
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- 3. HELPER LOGIC ---
    function getSmartInfo(pitch) {
        let target = pitch;
        if (!KEY_INFO[target]) {
             const keys = Object.keys(KEY_INFO).map(Number).sort((a,b)=>a-b);
             if (keys.length === 0) return null; // Safety check
             while(target < keys[0]) target += 12;
             while(target > keys[keys.length-1]) target -= 12;
             target = keys.reduce((prev, curr) => Math.abs(curr-target) < Math.abs(prev-target) ? curr : prev);
        }
        return KEY_INFO[target];
    }

    function addToHistory(char, row) {
        if (viewMode !== 'MOBILE') return;
        const bar = document.getElementById('history-bar');
        const item = document.createElement('span');
        item.className = 'history-item';
        item.innerHTML = char; 
        item.style.color = ROW_COLORS[row];
        item.style.borderColor = ROW_COLORS[row];
        bar.appendChild(item);
        setTimeout(() => { if(item.parentNode) item.remove(); }, 4000);
    }

    function generateSheetMusic(midi) {
        const container = document.getElementById('sheet-content');
        container.innerHTML = ""; sheetElements = [];
        let allNotesRaw = [];

        midi.tracks.forEach(track => {
            track.notes.forEach(note => {
                let info = getSmartInfo(note.midi);
                if (info) { // Safety check
                    allNotesRaw.push({ 
                        time: note.time, pitch: note.midi, 
                        char: viewMode==='MOBILE'? info.charMobile : info.charPC,
                        row: info.row, duration: note.duration
                    });
                }
            });
        });
        allNotesRaw.sort((a, b) => a.time - b.time);

        playGroups = [];
        if (allNotesRaw.length > 0) {
            let currentGroup = { time: allNotesRaw[0].time, notes: [allNotesRaw[0]] };
            for (let i = 1; i < allNotesRaw.length; i++) {
                if (allNotesRaw[i].time - currentGroup.time < 0.05) {
                    currentGroup.notes.push(allNotesRaw[i]);
                } else {
                    playGroups.push(currentGroup);
                    currentGroup = { time: allNotesRaw[i].time, notes: [allNotesRaw[i]] };
                }
            }
            playGroups.push(currentGroup);
        }

        playGroups.forEach(group => {
            const div = document.createElement('div');
            div.className = 'sheet-group';
            group.notes.sort((a,b) => a.row - b.row);
            group.notes.forEach(n => {
                const span = document.createElement('span');
                span.className = 'char-note'; span.innerText = n.char; span.style.color = ROW_COLORS[n.row];
                if(n.char.includes('#')) span.innerHTML = n.char.replace('#', '<small>#</small>');
                div.appendChild(span);
            });
            container.appendChild(div);
            sheetElements.push({ time: group.time, element: div });
        });
        const pad = document.createElement('div'); pad.style.width = "400px"; container.appendChild(pad);
    }

    // --- 4. ENGINE ---
    function updateSheet(currentTime) {
        const container = document.getElementById('sheet-container');
        const markerOffset = 50;
        let targetIdx;

        if (soundMode === 'WAIT' && isWaitingState) {
            targetIdx = nextGroupIndex;
        } else {
            targetIdx = sheetElements.findIndex(e => e.time > currentTime);
            if (targetIdx === -1 && sheetElements.length > 0) targetIdx = sheetElements.length;
            if (targetIdx > 0) targetIdx--; 
        }

        if (targetIdx >= 0 && targetIdx < sheetElements.length) {
            for(let i=0; i<sheetElements.length; i++) {
                const elm = sheetElements[i].element;
                if(i < targetIdx) { elm.classList.add('group-passed'); elm.classList.remove('group-active'); } 
                else if (i === targetIdx) { elm.classList.remove('group-passed'); elm.classList.add('group-active'); } 
                else { elm.classList.remove('group-active', 'group-passed'); }
            }
            const activeItem = sheetElements[targetIdx];
            container.scrollTo({ left: activeItem.element.offsetLeft - markerOffset, behavior: 'auto' }); 
        }
    }

    function checkWaitMode() {
        if (soundMode !== 'WAIT' || !isPlaying) return;
        
        if (nextGroupIndex < playGroups.length) {
            let nextGroup = playGroups[nextGroupIndex];
            if (Tone.Transport.seconds >= nextGroup.time - 0.05) { 
                Tone.Transport.pause();
                isWaitingState = true; 
                waitingForPitches.clear();
                nextGroup.notes.forEach(n => {
                    let info = getSmartInfo(n.pitch);
                    if(info) {
                        for(let p in KEY_INFO) {
                            if(KEY_INFO[p] === info) { waitingForPitches.add(parseInt(p)); break; }
                        }
                    }
                });
                updateSheet(nextGroup.time);
                document.getElementById('statusText').innerText = "WAITING FOR INPUT...";
                document.getElementById('statusText').style.color = "#ff4757";
            }
        } else { waitingForPitches.clear(); }
    }

    function resize() {
        if(canvas.parentElement) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
    }
    window.addEventListener('resize', resize);
    
    // *** THE INVINCIBLE DRAW LOOP ***
    function draw() {
        // Safety check: Canvas dimensions
        if(canvas.width === 0 || canvas.height === 0) resize();

        try {
            ctx.fillStyle = "#1a1a24"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (viewMode === 'PC') drawPCMode();
            else drawMobileMode();

            if (isPlaying && midiData) {
                updateSheet(Tone.Transport.seconds);
                checkWaitMode();
            }
        } catch (error) {
            // Anti-Crash: Just log it and keep looping
            console.error("Draw Loop Error (Recovered):", error);
        }
        
        requestAnimationFrame(draw);
    }

    function drawMobileMode() {
        const rowH = canvas.height / 4;
        [ROWS.LOW, ROWS.MID, ROWS.HIGH].forEach((rowKeys, rIdx) => {
            let slotW = canvas.width / rowKeys.length;
            let startY = canvas.height - (rowH * (rIdx+1));
            let rowColor = ROW_COLORS[rIdx];

            ctx.fillStyle = (rIdx%2==0) ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.05)";
            ctx.fillRect(0, startY, canvas.width, rowH);
            ctx.strokeStyle = rowColor; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, startY); ctx.lineTo(canvas.width, startY); ctx.stroke();

            ctx.save(); ctx.fillStyle = rowColor; ctx.font = "bold 12px Nunito"; ctx.textAlign = "left";
            ctx.fillText(["LOW", "MID", "HIGH"][rIdx], 5, startY + 15); ctx.restore();

            rowKeys.forEach((pitch, sIdx) => {
                let info = KEY_INFO[pitch];
                if (!info) return;

                let x = sIdx * slotW;
                let y = startY + (rowH * 0.25);
                let w = slotW; let h = rowH * 0.7;
                
                let isPressed = activeTouches.has(pitch) || activeAutoNotes.has(pitch);
                let isWaiting = waitingForPitches.has(pitch);
                let cx = x + w/2; let cy = y + h/2;
                
                ctx.beginPath();
                if(info.style === 'w') roundRectPath(ctx, x+2, y, w-4, h, 12);
                else ctx.arc(cx, cy, Math.min(w,h)/2.5, 0, Math.PI*2);

                if (pitch === wrongKeyFeedback) {
                    ctx.shadowBlur = 20; ctx.shadowColor = "#ff0000"; ctx.fillStyle = "#ff0000";
                } else if(isPressed) {
                    ctx.shadowBlur = 20; ctx.shadowColor = rowColor; ctx.fillStyle = rowColor;
                } else if (isWaiting) {
                    let alpha = (Math.sin(Date.now() / 100) + 1) / 2 * 0.6 + 0.2;
                    ctx.fillStyle = `rgba(255, 71, 87, ${alpha})`;
                } else {
                    ctx.shadowBlur = 0; ctx.fillStyle = (info.style==='w' ? "#ece5d8" : "#2d2d37");
                }
                ctx.fill();

                if (pitch !== wrongKeyFeedback) {
                    if(isWaiting) { ctx.lineWidth=3; ctx.strokeStyle="#ff4757"; ctx.stroke(); }
                    else if(info.style==='b') { ctx.lineWidth=2; ctx.strokeStyle="#ece5d8"; ctx.stroke(); }
                }

                ctx.fillStyle = (isPressed || pitch === wrongKeyFeedback) ? "#000" : (info.style==='w' ? "#1a1a24" : "#fff");
                if(isWaiting && !isPressed) ctx.fillStyle = "#fff";
                
                ctx.font = info.style==='w' ? "bold 24px Nunito" : "bold 16px Nunito"; 
                ctx.textAlign = "center";
                ctx.fillText(info.charMobile, cx, cy + 8);
                
                ctx.shadowBlur = 0;
            });
        });
    }

    function drawPCMode() {
        const slotW = canvas.width / MAX_SLOTS_PC;
        const hitY = canvas.height - 100;

        if (midiData && isPlaying) {
             const now = Tone.Transport.seconds;
             playGroups.forEach(group => { 
                 let timeDiff = group.time - now;
                 if (timeDiff > -0.2 && timeDiff < 3.0) {
                     group.notes.forEach(note => {
                         let info = getSmartInfo(note.pitch);
                         if(info && info.slotGlobal !== undefined){
                             let x = info.slotGlobal * slotW;
                             let y = hitY - (timeDiff * 400); 
                             
                             // *** FIXED LONG NOTE VISUAL ***
                             // Calculate tail length based on duration
                             let h = Math.max(20, note.duration * 400); 

                             ctx.fillStyle = ROW_COLORS[info.row];
                             if (y >= hitY - 10 && y <= hitY + 10) ctx.fillStyle = "#fff";
                             
                             // Draw note rect
                             if (y - h < canvas.height) { // Simple optimization
                                 ctx.fillRect(x + 2, y - h, slotW - 4, h);
                             }
                         }
                     });
                 }
             });
        }

        for (let p in KEY_INFO) {
            let pitch = parseInt(p); let info = KEY_INFO[p];
            // Safety Check
            if(!info) continue; 

            let x = info.slotGlobal * slotW; let y = hitY; let w = slotW; let h = 80;
            
            let isPressed = activeTouches.has(pitch) || activeAutoNotes.has(pitch);
            let isWaiting = waitingForPitches.has(pitch); 
            let color = ROW_COLORS[info.row];

            if (pitch === wrongKeyFeedback) { ctx.shadowBlur = 20; ctx.shadowColor = "#ff0000"; ctx.fillStyle = "#ff0000"; } 
            else if(isPressed) { ctx.shadowBlur = 15; ctx.shadowColor = color; ctx.fillStyle = color; } 
            else if (isWaiting) { 
                let a=(Math.sin(Date.now()/100)+1)/2*0.5+0.2; 
                ctx.fillStyle = `rgba(255, 71, 87, ${a})`; 
                ctx.strokeStyle = "#ff4757"; ctx.lineWidth=2; ctx.strokeRect(x+1,y,w-2,h); 
            } else { 
                ctx.shadowBlur = 0; ctx.fillStyle = (info.style==='w' ? "#ece5d8" : "#2d2d37"); 
            }
            
            if(pitch !== wrongKeyFeedback) { roundRect(ctx, x+1, y, w-2, h, 6); ctx.fill(); }
            else { ctx.fillRect(x+1,y,w-2,h); }
            
            ctx.shadowBlur = 0; 
            ctx.fillStyle = (isPressed || pitch === wrongKeyFeedback) ? "#000" : (info.style==='w' ? "#333" : "#aaa");
            if(isWaiting && !isPressed) ctx.fillStyle = "#fff"; 
            ctx.font = "bold 14px Nunito"; ctx.textAlign = "center"; 
            ctx.fillText(info.charPC, x + w/2, y + 45);
        }
    }

    function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); roundRectPath(ctx,x,y,w,h,r); ctx.closePath(); }
    function roundRectPath(ctx, x, y, width, height, radius) {
        ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height); ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y);
    }

    // --- 6. INPUT & LOGIC ---
    function getPitchFromXY(x, y) {
        const rect = canvas.getBoundingClientRect();
        const rX = (x - rect.left) * (canvas.width / rect.width);
        const rY = (y - rect.top) * (canvas.height / rect.height);
        
        if (viewMode === 'PC') {
            const hitH = 150; if (rY < canvas.height - hitH) return null;
            const slotW = canvas.width / MAX_SLOTS_PC; const slot = Math.floor(rX / slotW);
            for (let p in KEY_INFO) { if (KEY_INFO[p].slotGlobal === slot) return parseInt(p); }
        } else {
            const rowH = canvas.height / 4; let rowIdx = -1;
            if (rY > canvas.height - rowH) rowIdx = 0;
            else if (rY > canvas.height - rowH * 2) rowIdx = 1;
            else if (rY > canvas.height - rowH * 3) rowIdx = 2;
            if (rowIdx === -1) return null;
            let rowKeys = (rowIdx === 0) ? ROWS.LOW : (rowIdx === 1) ? ROWS.MID : ROWS.HIGH;
            const slotW = canvas.width / rowKeys.length; const slot = Math.floor(rX / slotW);
            if (slot >= 0 && slot < rowKeys.length) return rowKeys[slot];
        }
        return null;
    }

    function playNote(pitch) {
        if (!activeTouches.has(pitch)) {
            activeTouches.add(pitch);
            
            if (soundMode === 'WAIT' && waitingForPitches.size > 0) {
                if (waitingForPitches.has(pitch)) {
                    sampler.triggerAttack(Tone.Frequency(pitch, "midi").toNote());
                    Tone.Transport.start(); 
                    isWaitingState = false; 
                    nextGroupIndex++; waitingForPitches.clear(); 
                    document.getElementById('statusText').innerText = "PLAYING...";
                    document.getElementById('statusText').style.color = "#00ff88";
                    
                    let info = KEY_INFO[pitch];
                    if(info) addToHistory(viewMode==='MOBILE'? info.charMobile : info.charPC, ROW_COLORS[info.row]);
                } else {
                    wrongKeyFeedback = pitch; setTimeout(() => { wrongKeyFeedback = null; }, 300);
                }
            } else if (soundMode === 'MANUAL') {
                sampler.triggerAttack(Tone.Frequency(pitch, "midi").toNote());
                let info = KEY_INFO[pitch];
                if(info) addToHistory(viewMode==='MOBILE'? info.charMobile : info.charPC, ROW_COLORS[info.row]);
            }
        }
    }
    
    function stopNote(pitch) {
        if (activeTouches.has(pitch)) {
            activeTouches.delete(pitch);
            if(soundMode !== 'AUTO') sampler.triggerRelease(Tone.Frequency(pitch, "midi").toNote());
        }
    }

    // Events
    canvas.addEventListener('mousedown', async (e) => { await Tone.start(); let p = getPitchFromXY(e.clientX, e.clientY); if(p) playNote(p); });
    canvas.addEventListener('mouseup', () => { activeTouches.forEach(p => stopNote(p)); });
    window.addEventListener('keydown', async (e) => { if(e.repeat) return; await Tone.start(); const k = e.key.toLowerCase(); if(KEY_MAP_PC[k]) playNote(KEY_MAP_PC[k]); });
    window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if(KEY_MAP_PC[k]) stopNote(KEY_MAP_PC[k]); });
    canvas.addEventListener('touchstart', async (e) => { e.preventDefault(); await Tone.start(); for (let i=0; i<e.changedTouches.length; i++) { let p = getPitchFromXY(e.changedTouches[i].clientX, e.changedTouches[i].clientY); if(p) playNote(p); } }, {passive:false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); activeTouches.forEach(p => stopNote(p)); });

    // --- 7. MAIN ---
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const ab = await file.arrayBuffer(); midiData = new Midi(ab);
        Tone.Transport.stop(); Tone.Transport.cancel();
        
        generateSheetMusic(midiData);
        nextGroupIndex = 0; waitingForPitches.clear(); activeAutoNotes.clear(); isWaitingState = false;

        midiData.tracks.forEach(track => {
            track.notes.forEach(note => {
                Tone.Transport.schedule((time) => {
                    if (soundMode === 'AUTO') {
                        sampler.triggerAttackRelease(note.name, note.duration, time);
                        
                        // VISUALS FOR AUTO MODE
                        Tone.Draw.schedule(() => {
                            let info = getSmartInfo(note.midi);
                            // Find matching mapped key
                            for(let p in KEY_INFO) {
                                if(KEY_INFO[p] === info) {
                                    let pitch = parseInt(p);
                                    activeAutoNotes.add(pitch);
                                    // Add to history if mobile
                                    addToHistory(viewMode==='MOBILE'? info.charMobile : info.charPC, ROW_COLORS[info.row]);
                                    break;
                                }
                            }
                        }, time);
                        
                        Tone.Draw.schedule(() => {
                            let info = getSmartInfo(note.midi);
                            for(let p in KEY_INFO) { if(KEY_INFO[p] === info) { activeAutoNotes.delete(parseInt(p)); break; } }
                        }, time + note.duration);
                    }
                }, note.time);
            });
        });
        
        document.getElementById('statusText').innerText = "Ready: " + file.name;
        document.getElementById('statusText').style.color = "#00ff88";
        document.getElementById('btnPlay').innerText = "PLAY";
        // Disabled removed from HTML, logic here is fine
        isPlaying = false;
    });

    document.getElementById('btnPlay').addEventListener('click', async () => {
        if(!midiData) return alert("Load MIDI first");
        await Tone.start();
        if (Tone.Transport.state === 'started') {
            Tone.Transport.pause(); isPlaying = false;
            document.getElementById('btnPlay').innerText = "RESUME";
        } else {
            Tone.Transport.start(); isPlaying = true;
            document.getElementById('btnPlay').innerText = "PAUSE";
        }
    });

    document.getElementById('btnPlayMode').addEventListener('click', (e) => {
        let modes = ['AUTO', 'MANUAL', 'WAIT'];
        let nextIdx = (modes.indexOf(soundMode) + 1) % modes.length;
        soundMode = modes[nextIdx];
        e.target.innerText = "Mode: " + soundMode;
        e.target.setAttribute('data-mode', soundMode);
        if(soundMode === 'WAIT') {
             Tone.Transport.stop(); isPlaying = false; 
             document.getElementById('btnPlay').innerText = "START WAIT";
             nextGroupIndex = 0; waitingForPitches.clear(); isWaitingState = false;
        }
    });

    document.getElementById('btnViewMode').addEventListener('click', (e) => {
        viewMode = (viewMode === 'MOBILE') ? 'PC' : 'MOBILE';
        e.target.innerText = "View: " + viewMode;
        const hist = document.getElementById('history-bar');
        hist.style.display = (viewMode === 'MOBILE') ? 'flex' : 'none';
        if(midiData) generateSheetMusic(midiData);
    });
    
    // Init state
    document.getElementById('history-bar').style.display = 'flex';
    resize();
    draw();
</script>
</body>
</html>
